# ローカル開発環境。
#
# - server には container_name も固定のホストポートへの依存も持たせない。`docker compose up --scale server=2` で増やせるようにする。
#   ホストに公開するのは Caddy（ロードバランサ）だけで、server には Caddy を通って到達する（ロードマップ Phase 5、ADR 0016）。
#   サービス同士はサービス名（postgres / redis / s3 / server）で到達する。
# - postgres / redis はホストにポートを公開しない。psql は `make psql` でコンテナ内から使う。
#   ホストに psql を要求しないことと、他プロジェクトの 5432 / 6379 と衝突しないことが理由。
# - Next.js（web/）はここに入れず、ホストで起動する（CLAUDE.md「技術スタック」）。

name: hibari

services:
  postgres:
    # pg_bigm を足した自前のイメージ（ADR 0061 決定 1）。素の postgres:16-alpine では検索の索引が作れない。
    # CI も同じ Dockerfile をビルドして使う（.github/workflows/go.yml）。
    build:
      context: ./db/postgres
    image: hibari-postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hibari}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hibari}
      POSTGRES_DB: ${POSTGRES_DB:-hibari}
      # initdb は -A / --auth-local / --auth-host を省くと「trust を有効にした」と警告する。
      # 値は公式イメージの既定と同じにして明示する（コンテナ内のソケットは trust、TCP はパスワード）。
      # 効くのはボリュームを初期化するとき（初回の起動）だけ。
      POSTGRES_INITDB_ARGS: --auth-local=trust --auth-host=scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 統合テスト用の DB（hibari_test）を初回起動時に作る。開発データとテストを混ぜないため。
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    # presence のフィールドごとの TTL（HEXPIRE）に 7.4 以降が必要（ADR 0016）。
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    # S3 互換のストレージ。RustFS を使う（ADR 0008 の追記）。MinIO は公式のイメージの配布をやめた（2026-09）。
    # 使うのは S3 API の PUT / GET / HEAD / DELETE と署名付き URL、バケットの CORS だけ（ADR 0008）。
    # サービス名を製品名にしないのは、また替えるときに server の設定やテストの接続先を変えずに済むようにするため。
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${LOCAL_S3_ACCESS_KEY:-hibari}
      RUSTFS_SECRET_KEY: ${LOCAL_S3_SECRET_KEY:-hibari-secret}
      # 管理画面（http://localhost:9001/rustfs/console/）。アップロードしたファイルを見るのに使う
      RUSTFS_CONSOLE_ENABLE: "true"
    # ブラウザが署名付き URL で直接 PUT / GET するので、API はホストに公開する（ADR 0008）。
    ports:
      - "${LOCAL_S3_PORT:-9000}:9000"
      - "${LOCAL_S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  # バケットを作る使い捨てのコンテナ。アプリはバケットを作らない（本番のバケットはインフラの側で作る。ADR 0013）。
  # 開発用（hibari）とテスト用（hibari-test）を分けるのは、DB と同じく開発データとテストを混ぜないため。
  # S3 の CLI を入れず、curl の SigV4 署名で S3 API を直接呼ぶ（ストレージの製品に依存しない）。
  # 開発用のバケットには、本番の R2 と同じく CORS を設定する（許すのは Web の origin からの PUT / GET だけ）。
  s3-init:
    image: curlimages/curl:8.22.0
    environment:
      ACCESS_KEY: ${LOCAL_S3_ACCESS_KEY:-hibari}
      SECRET_KEY: ${LOCAL_S3_SECRET_KEY:-hibari-secret}
      WEB_ORIGIN: ${APP_BASE_URL:-http://localhost:3000}
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        s3() { curl -fsS --aws-sigv4 "aws:amz:us-east-1:s3" --user "$$ACCESS_KEY:$$SECRET_KEY" "$$@"; }
        # RustFS は作成済みのバケットにも 200 を返すので、何度起動してもよい
        s3 -X PUT http://s3:9000/hibari -o /dev/null
        s3 -X PUT http://s3:9000/hibari-test -o /dev/null
        cors="<CORSConfiguration><CORSRule><AllowedOrigin>$$WEB_ORIGIN</AllowedOrigin><AllowedMethod>PUT</AllowedMethod><AllowedMethod>GET</AllowedMethod><AllowedHeader>content-type</AllowedHeader><MaxAgeSeconds>600</MaxAgeSeconds></CORSRule></CORSConfiguration>"
        s3 -X PUT "http://s3:9000/hibari?cors=" -H "Content-Type: application/xml" --data "$$cors" -o /dev/null
    depends_on:
      s3:
        condition: service_healthy

  server:
    build:
      context: .
      target: dev
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hibari}:${POSTGRES_PASSWORD:-hibari}@postgres:5432/${POSTGRES_DB:-hibari}?sslmode=disable
      TEST_DATABASE_URL: postgres://${POSTGRES_USER:-hibari}:${POSTGRES_PASSWORD:-hibari}@postgres:5432/hibari_test?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      TEST_REDIS_URL: redis://redis:6379/1
      HTTP_ADDR: :8080
      # `make keys` で作る開発用の鍵。リポジトリを /src に bind mount しているのでそのまま読める。
      JWT_PRIVATE_KEY_FILE: /src/keys/jwt_ed25519.pem
      # 開発ではメールを送らず、確認や再設定のリンクを server のログに出す（ADR 0053 決定 5）。
      MAIL_TRANSPORT: log
      # 開発では email の検証なしで chat を使えるようにする（ADR 0053 決定 4）。検証の流れを試すときは true にし、
      # ログに出る確認のリンクを開く。MAIL_TRANSPORT=smtp のときは false にできない（起動しない）。
      AUTH_REQUIRE_VERIFIED_EMAIL: ${AUTH_REQUIRE_VERIFIED_EMAIL:-false}
      # X-Forwarded-For を信用するのは Caddy からの接続だけ（ADR 0017）。
      TRUSTED_PROXIES: ${CADDY_IP:-172.31.250.10}/32
      # サーバーはサービス名でストレージに到達し、署名付き URL はブラウザから到達できるホスト名で作る（ADR 0013）。
      # 開発ではルートの認証情報をそのまま使う。
      S3_ENDPOINT: http://s3:9000
      S3_PUBLIC_ENDPOINT: http://localhost:${LOCAL_S3_PORT:-9000}
      S3_BUCKET: hibari
      S3_ACCESS_KEY_ID: ${LOCAL_S3_ACCESS_KEY:-hibari}
      S3_SECRET_ACCESS_KEY: ${LOCAL_S3_SECRET_KEY:-hibari-secret}
      S3_USE_PATH_STYLE: "true"
      # テストはコンテナの中で署名付き URL にも PUT するので、公開エンドポイントを分けない。
      TEST_S3_ENDPOINT: http://s3:9000
      TEST_S3_BUCKET: hibari-test
      TEST_S3_ACCESS_KEY_ID: ${LOCAL_S3_ACCESS_KEY:-hibari}
      TEST_S3_SECRET_ACCESS_KEY: ${LOCAL_S3_SECRET_KEY:-hibari-secret}
    # ホストには公開しない。Caddy が振り分ける。
    volumes:
      - .:/src
      # air のビルド先（tmp/）はレプリカごとに分ける。bind mount のままだと、複数のレプリカが同じバイナリを同時に書き換えて壊す。
      - /src/tmp
      # モジュールキャッシュとビルドキャッシュは named volume に置く。
      # bind mount に置くと macOS では遅く、再作成のたびにダウンロードとビルドがやり直しになる。
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully

  # ロードバランサ（ADR 0016）。ホストに公開するのはこれだけで、web/ の API のベース URL（localhost:8080）はここに向く。
  caddy:
    image: caddy:2.10-alpine
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      default:
        # server の TRUSTED_PROXIES に書くので、アドレスを固定する（ADR 0017）。
        ipv4_address: ${CADDY_IP:-172.31.250.10}
    depends_on:
      - server

networks:
  default:
    ipam:
      config:
        # Caddy のアドレスを固定するために、サブネットを決める。ほかのネットワークと衝突したら .env で変える。
        # 自動で割り当てるアドレスは後ろ半分に限り、固定したアドレスとぶつからないようにする。
        - subnet: ${COMPOSE_SUBNET:-172.31.250.0/24}
          ip_range: ${COMPOSE_IP_RANGE:-172.31.250.128/25}

volumes:
  pgdata:
  s3data:
  gomod:
  gobuild:
