# Go の CI。PR ごとに実行し、落ちている PR はマージしない（CLAUDE.md「テスト」）。
name: go

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: go mod tidy に差分がない
        run: |
          go mod tidy -diff
          (cd tools && go mod tidy -diff)
      - name: sqlc の生成結果に差分がない
        # db/queries や db/migrations を変えて `make sqlc` を忘れた PR を落とす。
        run: go tool -modfile=tools/go.mod sqlc diff
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        # バージョンは tools/go.mod で固定したものを使い、ローカルの `make lint` と一致させる。
        run: go tool -modfile=tools/go.mod golangci-lint run ./...

  test:
    runs-on: ubuntu-latest
    # DB を使う処理はモックにせず、サービスコンテナの実物でテストする。
    # イメージは compose.yaml と揃える。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hibari
          POSTGRES_PASSWORD: hibari
          POSTGRES_DB: hibari_test
          # 認証方式を明示し、initdb の「trust を有効にした」警告を消す（compose.yaml と同じ）。
          # 値は公式イメージの既定と同じで、振る舞いは変わらない。
          POSTGRES_INITDB_ARGS: --auth-local=trust --auth-host=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hibari -d hibari_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # CI=true（GitHub Actions が設定する）のとき、接続先がなければテストはスキップせずに失敗する（internal/platform/testenv）。
      TEST_DATABASE_URL: postgres://hibari:hibari@localhost:5432/hibari_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/1
      TEST_S3_ENDPOINT: http://localhost:9000
      TEST_S3_BUCKET: hibari-test
      TEST_S3_ACCESS_KEY_ID: hibari
      TEST_S3_SECRET_ACCESS_KEY: hibari-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Redis を起動する
        # サービスコンテナは起動コマンドを渡せず、起動する前にホストのカーネルの設定も変えられないので、docker run で起動する。
        # イメージは compose.yaml と揃える。
        # - vm.overcommit_memory=1: 無効のままだと Redis が起動時に警告する（fork によるバックグラウンドの保存が失敗しうるため）
        # - 引数を渡す: 何も渡さないと「設定ファイルがない」と警告する。テストのデータは残さなくてよいので保存も切る
        run: |
          sudo sysctl -w vm.overcommit_memory=1
          docker run -d --name redis -p 6379:6379 redis:7.4-alpine redis-server --save "" --appendonly no
          for _ in $(seq 30); do
            docker exec redis redis-cli ping && break
            sleep 1
          done
      - name: MinIO を起動してテスト用のバケットを作る
        # サービスコンテナは起動コマンド（server /data）を渡せないので、docker run で起動する。イメージは compose.yaml と揃える。
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$TEST_S3_ACCESS_KEY_ID" -e MINIO_ROOT_PASSWORD="$TEST_S3_SECRET_ACCESS_KEY" \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for _ in $(seq 30); do
            curl -fsS http://localhost:9000/minio/health/live && break
            sleep 2
          done
          docker exec minio mc alias set local http://localhost:9000 "$TEST_S3_ACCESS_KEY_ID" "$TEST_S3_SECRET_ACCESS_KEY"
          docker exec minio mc mb --ignore-existing local/hibari-test
      - name: マイグレーション（up → reset → up）
        # Down も壊れていないことを確かめるため、一度すべて戻してから適用し直す。
        run: |
          goose() { go tool -modfile=tools/go.mod goose -dir db/migrations postgres "$TEST_DATABASE_URL" "$@"; }
          goose up
          goose reset
          goose up
      - name: go test -race
        run: go test -race -count=1 ./...
