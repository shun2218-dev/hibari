# site/（ドキュメントサイト。ADR 0064）の CI。PR ごとに実行する。
# docs/ を読んでビルドするので、docs/ だけを変えた PR でも壊れていないか（生の HTML、リンク先）をここで止める。
name: site

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: site

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: 型チェック
        run: npm run typecheck
      - name: Vitest
        run: npm test
      - name: build
        run: npm run build
