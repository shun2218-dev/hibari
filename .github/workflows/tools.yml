# tools/ のシェルスクリプトのテスト。PR ごとに実行する（CLAUDE.md「テスト」）。
name: tools

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: tools/release-ids.sh
        # release の PR に並べる Linear の Issue の ID の集め方を確かめる。
        run: tools/release-ids_test.sh
